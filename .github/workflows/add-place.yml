name: Add Place from Issue

on:
  issues:
    types: [opened, labeled]

jobs:
  add-place:
    # Run when the add-place label is present
    # For 'labeled' event: only when that specific label was just added
    # For 'opened' event: only if the label was already on the issue
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'add-place') ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'add-place'))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Extract place input from issue
        id: extract
        run: |
          BODY=$(cat << 'BODYEOF'
          ${{ github.event.issue.body }}
          BODYEOF
          )
          # Try to grab a Google Maps URL first
          URL=$(echo "$BODY" | grep -oE 'https://www\.google\.com/maps/[^[:space:]"]+' | head -1)
          if [ -z "$URL" ]; then
            # Fall back to issue title as the place name
            URL="${{ github.event.issue.title }}"
          fi
          echo "place_input=$URL" >> $GITHUB_OUTPUT

      - name: Run add_place.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python add_place.py "${{ steps.extract.outputs.place_input }}"

      - name: Commit updated places.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add places.json
          git diff --staged --quiet || git commit -m "Add place: ${{ github.event.issue.title }}"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Place added!** Your map will update in ~30 seconds.\n\nIf the pin is in the wrong spot or details look off, edit \`places.json\` directly on GitHub to fix it.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
